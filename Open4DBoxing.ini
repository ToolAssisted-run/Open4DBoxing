; ===========================
; Open4DBoxing configuration
; ===========================

; This is the configuration file of Open4DBoxing's frontend (frontend/main.c).
; Lines starting with a semicolon (";") are comments and are ignored.
; "default" is a valid setting for any option.
;
; Every default is what Open4DBoxing does without this file. Open4DBoxing looks for it in this order:
;   1. Open4DBoxing.ini in the current folder
;   2. Open4DBoxing.ini next to the open4dboxing program
;   3. Open4DBoxing.ini in the game's folder
; Unknown options are reported on the terminal and ignored. The game's own arguments on the command line (the sound
; driver's file) win over this file's for that run.
;
; The in-game menu (F4) changes settings too, as SDLPoP's does: it saves them, when the menu closes, to Open4DBoxing.cfg
; next to this file (in the game's folder when there is no Open4DBoxing.ini), in this file's syntax, and Open4DBoxing.cfg
; is read after this file - unless this file is newer (edited since): then Open4DBoxing.cfg is ignored. Delete
; Open4DBoxing.cfg to go back to this file's settings.


[General]
; Start the game in fullscreen mode. (In-game fullscreen toggle: Alt+Enter)
start_fullscreen = false

; Width and height of the game window, in pixels.
; By default (auto) the window is 960 x 720 (960 x 600 without the 4:3 aspect ratio below).
window_width = default
window_height = default

; Show the game in the 4:3 aspect ratio of the VGA's 320 x 200 picture on a monitor of the time (drawn 1.2 times
; taller than wide). false: square pixels (320 x 200 = 16:10).
use_correct_aspect_ratio = true

; Make all pixels the same size by using integer scale factors only (black borders fill the rest).
use_integer_scaling = false

; Scaling method.
; Possible values:
; * sharp  = Use nearest-neighbour resampling.
; * fuzzy  = First scale to double size with nearest-neighbour scaling, then scale to the window with smooth scaling.
; * blurry = Use smooth scaling.
scaling_type = sharp

; The sound driver the game loads (its command line's second argument). Takes effect at the next start.
; Possible values:
; * speaker = the PC speaker (PC15.DRV).
; * adlib   = the AdLib (AD15.DRV): FM music and effects.
; * sb      = the Sound Blaster (SB15.DRV): FM music and the digitised announcer and crowd. (default)
; * tandy   = the Tandy 1000's sound chip (TD15.DRV).
; * mt32    = the Roland MT-32 (MT15.DRV), emulated by Munt. Needs its ROMs (a control ROM and a PCM ROM, any names)
;             in the folder given by mt32_roms below, the "roms" folder of Open4DBoxing's user data or next to the
;             program, or the game's folder (see README); without them, the Sound Blaster.
sound = sb

; The build that runs: the game came as four programs, one a video card. Takes effect at the next start.
; Possible values:
; * mcga  = the MCGA/VGA program (4DBMCGA.EXE): 256 colours. (default)
; * ega   = the EGA program (4DBEGA.EXE): 16 colours.
; * cga   = the CGA program (4DBCGA.EXE): 4 colours.
; * tandy = the Tandy 1000 program (4DBTDY.EXE): 16 colours.
video = mcga

; Volume, 0 (silent) to 15 (full). (default = 15)
volume = 15

; The folder with the MT-32's ROMs (looked at after the OPEN4DBOXING_MT32ROMS environment variable's, before the
; default places). Empty (default): the default places only.
mt32_roms = default


[Controller]
; A joystick or game controller that is plugged in is the game's first joystick (a controller's left stick or D-pad
; moves, A punches, B is the game's first button): choose it in the game's GAME OPTIONS panel (the title's OPTIONS)
; and calibrate it there.
enable_joystick = true
